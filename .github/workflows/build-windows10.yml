name: Build YT Studio Downloader - Windows 10 x64

'on':
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Show .NET version
        run: dotnet --version

      - name: Restore
        run: dotnet restore YTStudioDownloader.csproj

      - name: Build
        run: dotnet build YTStudioDownloader.csproj --configuration Release --no-restore

      - name: Publish Windows x64
        run: dotnet publish YTStudioDownloader.csproj --configuration Release --runtime win-x64 --self-contained true --output publish -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: YT-Studio-Downloader-Windows10-x64
          path: publish/
          if-no-files-found: error
